<!DOCTYPE html>
<html lang="$lang$" data-theme="$theme$">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>$title$$if(site-title)$ · $site-title$$endif$</title>
  $if(author-meta)$<meta name="author" content="$author-meta$">$endif$
  $if(description-meta)$<meta name="description" content="$description-meta$">$endif$
  $if(css)$<link rel="stylesheet" href="$css$">$endif$
</head>
<body class="font-sans antialiased text-accent-950 dark:text-accent-50 bg-white dark:bg-stone-950 max-w-3xl mx-auto p-6">
  <header class="flex items-center gap-3 pb-4 mb-8 border-b border-accent-300/30 dark:border-accent-700/30">
    <a href="$if(base-url)$$base-url$/$else$$index-href$$endif$" class="flex items-center gap-2 no-underline text-inherit">
      $if(logo-inline)$<span class="flex h-8 w-8 shrink-0 items-center justify-center text-accent-500 logo-fill">$logo-inline$</span>$endif$
      <span class="font-bold text-lg text-accent-700 dark:text-accent-300">$site-title$</span>
    </a>
    <a href="$if(base-url)$$base-url$/index.html$else$$index-href$$endif$" class="text-sm text-accent-400 dark:text-accent-500 hover:underline ml-4">Índice</a>
    $if(tagline)$<span class="text-sm text-accent-400 dark:text-accent-500 ml-auto">$tagline$</span>$endif$
  </header>
  <main class="prose prose-accent dark:prose-invert max-w-none">
    $body$
  </main>
  <footer class="mt-12 pt-4 border-t border-accent-300/30 dark:border-accent-700/30 text-sm text-center text-accent-400 dark:text-accent-500">
    <p>$if(site-title)$© $site-title$$endif$</p>
  </footer>
</body>
</html>
