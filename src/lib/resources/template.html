<!DOCTYPE html>
<html lang="$lang$" data-theme="$theme$">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>$title$$if(site-title)$ · $site-title$$endif$</title>
  $if(author-meta)$<meta name="author" content="$author-meta$">$endif$
  $if(description-meta)$<meta name="description" content="$description-meta$">$endif$
  $if(css)$<link rel="stylesheet" href="$css$">$endif$
</head>
<body class="min-h-dvh flex flex-col font-sans antialiased text-accent-950 dark:text-accent-50 bg-grid-accent bg-white dark:bg-stone-950">
  <header class="flex items-center gap-2 px-4 sm:px-6 lg:px-8 py-3 border-b border-accent-300/30 dark:border-accent-700/30 bg-white/80 dark:bg-stone-900/80 backdrop-blur">
    $if(logo-inline)$<span class="flex h-7 w-7 shrink-0 items-center justify-center text-accent-500 logo-fill">$logo-inline$</span>$endif$
    <div class="flex flex-col">
      <span class="font-bold text-base leading-tight text-accent-700 dark:text-accent-300">$site-title$</span>
      $if(tagline)$<span class="text-xs leading-tight text-accent-400 dark:text-accent-500">$tagline$</span>$endif$
    </div>
  </header>
  <main class="columns-1 md:columns-2 xl:columns-3 gap-6 px-4 sm:px-6 lg:px-8 py-8">
    <div class="break-inside-avoid pb-6">
      <article class="prose prose-accent dark:prose-invert max-w-none rounded-2xl border border-accent-500/20 shadow-lg bg-white/80 dark:bg-stone-900/80 p-6 ring-1 ring-inset ring-accent-500/10 hover:shadow-xl transition-shadow duration-300 [overflow-wrap:anywhere]">
        $body$
      </article>
    </div>
    $if(toc)$
    <div class="break-inside-avoid pb-6">
      <nav id="TOC" class="rounded-2xl border border-accent-500/20 shadow-lg bg-white/80 dark:bg-stone-900/80 p-4 text-sm [overflow-wrap:anywhere]">
        $toc$
      </nav>
    </div>
    $endif$
  </main>
  <footer class="mt-auto px-4 sm:px-6 lg:px-8 py-3 border-t border-accent-300/30 dark:border-accent-700/30 bg-white/80 dark:bg-stone-900/80 backdrop-blur">
    <div class="flex items-center gap-2 justify-end">
      $if(logo-inline)$<span class="flex h-7 w-7 shrink-0 items-center justify-center text-accent-500 logo-fill">$logo-inline$</span>$endif$
      <div class="flex flex-col">
        <span class="font-bold text-base leading-tight text-accent-700 dark:text-accent-300">$site-title$</span>
        $if(tagline)$<span class="text-xs leading-tight text-accent-400 dark:text-accent-500">$tagline$</span>$endif$
      </div>
    </div>
  </footer>
</body>
</html>
