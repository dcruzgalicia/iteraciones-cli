<!DOCTYPE html>
<html lang="$lang$" data-theme="$theme$">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>$title$$if(site-title)$ · $site-title$$endif$</title>
  $if(author-meta)$<meta name="author" content="$author-meta$">$endif$
  $if(css)$<link rel="stylesheet" href="$css$">$endif$
  $if(favicon)$$favicon$$endif$
  $if(keywords)$<meta name="keywords" content="$keywords$">$endif$
</head>
<body id="top" class="font-sans antialiased text-lg text-stone-900 dark:text-stone-100 bg-paper bg-paper-grid">

  <main class="lg:container mx-auto columns-1 md:columns-2 2xl:columns-3 gap-4 sm:gap-6 px-2 sm:px-4 lg:px-8 pt-6 sm:pt-8 pb-20 sm:pb-24">
<div id="slot-header"></div>
<div id="slot-metadata"></div>
<div id="slot-cards"></div>
<div id="slot-footer"></div>
  </main>

  <a
    href="#top"
    aria-label="Volver al principio"
    class="scroll-reveal supports-[animation-timeline:scroll()]:pointer-events-none supports-[animation-timeline:scroll()]:opacity-0 fixed bottom-6 left-1/2 -translate-x-1/2 z-50 flex size-12 items-center justify-center rounded-full border border-accent-500/90 bg-accent-500/35 text-accent-700 dark:border-accent-500/70 dark:bg-accent-500/25 dark:text-accent-300 shadow-lg shadow-accent-500/25 transition-colors duration-200 hover:bg-accent-500/45 hover:border-accent-500 dark:hover:bg-accent-500/35 dark:hover:border-accent-500/90"
  >
    <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
  </a>
</body>
</html>
