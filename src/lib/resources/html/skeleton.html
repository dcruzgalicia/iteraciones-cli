<!DOCTYPE html>
<html lang="$lang$" data-theme="$theme$">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>$title$$if(site-title)$ · $site-title$$endif$</title>
  $if(author-meta)$<meta name="author" content="$author-meta$">$endif$
  $if(description-meta)$<meta name="description" content="$description-meta$">$endif$
  $if(css)$<link rel="stylesheet" href="$css$">$endif$
</head>
<body id="top" class="font-sans antialiased text-xl text-accent-950 dark:text-accent-50 bg-stone-200 dark:bg-stone-950 [background-image:radial-gradient(circle,color-mix(in_srgb,var(--color-accent-600)_90%,transparent)_2px,transparent_2px),radial-gradient(circle_at_85%_8%,color-mix(in_srgb,var(--color-accent-600)_22%,transparent)_0,transparent_55%),linear-gradient(to_right,color-mix(in_srgb,var(--color-accent-600)_15%,transparent)_1px,transparent_1px),linear-gradient(to_bottom,color-mix(in_srgb,var(--color-accent-600)_15%,transparent)_1px,transparent_1px)] [background-size:48px_48px,100%_100%,48px_48px,48px_48px] dark:[background-image:radial-gradient(circle,color-mix(in_srgb,var(--color-accent-500)_45%,transparent)_2px,transparent_2px),radial-gradient(circle_at_85%_8%,color-mix(in_srgb,var(--color-accent-500)_12%,transparent)_0,transparent_55%),linear-gradient(to_right,color-mix(in_srgb,var(--color-accent-500)_8%,transparent)_1px,transparent_1px),linear-gradient(to_bottom,color-mix(in_srgb,var(--color-accent-500)_8%,transparent)_1px,transparent_1px)] dark:[background-size:64px_64px,100%_100%,64px_64px,64px_64px]">
  <main class="columns-1 md:columns-2 2xl:columns-3 gap-6 px-4 sm:px-6 lg:px-8 pt-8 pb-24">
<!-- cards -->
</main>

  <!-- Botón flotante: aparece al hacer scroll y desaparece al volver al
       principio (scroll-driven animation, cero JS; ver styles.css). -->
  <a
    href="#top"
    aria-label="Volver al principio"
    class="scroll-reveal fixed bottom-6 left-1/2 -translate-x-1/2 z-50 flex size-12 items-center justify-center rounded-full border border-accent-500/90 bg-accent-500/35 text-accent-600 dark:border-accent-500/70 dark:bg-accent-500/25 dark:text-accent-400 shadow-lg shadow-accent-500/25 transition-colors duration-200 hover:bg-accent-500/45 hover:border-accent-500 dark:hover:bg-accent-500/35 dark:hover:border-accent-500/90"
  >
    <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
  </a>
</body>
</html>
