<!DOCTYPE html>
<html lang="$lang$" data-theme="$theme$">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>$title$$if(site-title)$ · $site-title$$endif$</title>
  $if(author-meta)$<meta name="author" content="$author-meta$">$endif$
  $if(css)$<link rel="stylesheet" href="$css$">$endif$
  $if(favicon)$$favicon$$endif$
  $if(keywords)$<meta name="keywords" content="$keywords$">$endif$
</head>
<body id="top" class="font-sans antialiased text-base text-stone-900 sm:text-lg dark:text-stone-100 bg-paper bg-paper-grid">

  <a href="#contenido" class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-[60] focus:rounded-full focus:bg-accent-600 focus:px-4 focus:py-2 focus:text-sm focus:font-semibold focus:text-white">Saltar al contenido</a>

  <div class="xl:container mx-auto space-y-4 px-2 pt-2 pb-28 sm:space-y-6 sm:px-4 sm:pt-4 sm:pb-32 lg:space-y-8 lg:px-8 lg:pt-8">
    <header>
      <div id="slot-header"></div>
    </header>

    <div class="grid items-start gap-4 sm:gap-6 md:grid-cols-2 lg:grid-cols-3 lg:gap-8">
      <main id="contenido" class="min-w-0 lg:col-span-2">
        <div class="mb-4 sm:mb-6 lg:mb-8">
          <div id="slot-page-header"></div>
        </div>
        <div class="grid items-start gap-4 sm:gap-6 main-grid lg:gap-8">
          <div class="min-w-0 space-y-4 sm:space-y-6 lg:space-y-8">
            <div id="slot-main"></div>
          </div>
          <div id="slot-related" class="min-w-0 space-y-4 sm:space-y-6 empty:hidden lg:space-y-8"></div>
        </div>
      </main>
      <aside aria-label="Información" class="min-w-0 space-y-4 sm:space-y-6 lg:col-span-1 lg:space-y-8">
        <div id="slot-sidebar"></div>
      </aside>
    </div>

    <footer>
      <div id="slot-footer"></div>
    </footer>
  </div>

  <a
    href="#top"
    aria-label="Volver al principio"
    class="scroll-reveal supports-[animation-timeline:scroll()]:pointer-events-none supports-[animation-timeline:scroll()]:opacity-0 fixed bottom-6 right-6 z-50 flex size-12 items-center justify-center rounded-full border border-accent-500/50 bg-accent-500/20 text-accent-800 shadow-sm transition-colors duration-200 hover:border-accent-500 hover:bg-accent-500/30 dark:border-accent-400/50 dark:bg-accent-500/20 dark:text-accent-200 dark:hover:bg-accent-500/30"
  >
    <img src="$icon-top$" alt="" class="h-6 w-6">
  </a>
</body>
</html>
