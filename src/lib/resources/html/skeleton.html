<!DOCTYPE html>
<html lang="$lang$" data-theme="$theme$">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  $if(meta-description)$<meta name="description" content="$meta-description$">$endif$
  $if(canonical)$<link rel="canonical" href="$canonical$">$endif$
  $if(social-meta)$$social-meta$$endif$
  $if(json-ld)$<script type="application/ld+json">$json-ld$</script>$endif$
  <title>$title$$if(site-title)$ · $site-title$$endif$</title>
  $if(author-meta)$<meta name="author" content="$author-meta$">$endif$
  $if(css)$<link rel="stylesheet" href="$css$">$endif$
  $if(favicon)$$favicon$$endif$
  $if(keywords)$<meta name="keywords" content="$keywords$">$endif$
</head>
<body id="top" class="font-sans antialiased text-base text-stone-900 sm:text-lg dark:text-stone-100 bg-paper bg-paper-grid">

  <a href="#contenido" class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-[60] focus:rounded-full focus:bg-accent-600 focus:px-4 focus:py-2 focus:text-sm focus:font-semibold focus:text-white">Saltar al contenido</a>

  <div class="xl:container mx-auto space-y-4 px-2 pt-2 pb-28 sm:space-y-6 sm:px-4 sm:pt-4 sm:pb-32 lg:space-y-8 lg:px-8 lg:pt-8">
    <header>
      <div id="slot-header"></div>
    </header>

    <div class="content-grid $page-type-class$">
      <main id="contenido" class="contents">
        <div id="slot-page-header" class="page-header min-w-0"></div>
        <div id="slot-main" class="page-main min-w-0 space-y-4 sm:space-y-6 lg:space-y-8"></div>
        <div id="slot-photo" class="page-photo min-w-0"></div>
        <div id="slot-publication-featured" class="page-publication-featured min-w-0"></div>
        <div id="slot-publications" class="page-publications creator-publications-grid min-w-0"></div>
        <div id="slot-related" class="page-related min-w-0 space-y-4 sm:space-y-6 lg:space-y-8"></div>
      </main>
      <aside aria-label="Información" class="contents">
        <div id="slot-sidebar" class="page-sidebar min-w-0 space-y-4 sm:space-y-6 lg:space-y-8"></div>
      </aside>
    </div>

    <footer>
      <div id="slot-footer"></div>
    </footer>
  </div>

  <a
    href="#top"
    aria-label="Volver al principio"
    class="scroll-reveal supports-[animation-timeline:scroll()]:opacity-0 fixed bottom-6 right-6 z-50 flex size-12 items-center justify-center rounded-full border border-accent-500/50 bg-accent-500/20 text-accent-800 shadow-sm transition-colors duration-200 hover:border-accent-500 hover:bg-accent-500/30 dark:border-accent-400/50 dark:bg-accent-500/20 dark:text-accent-200 dark:hover:bg-accent-500/30"
  >
    <img src="$icon-top$" alt="" width="36" height="36" class="h-9 w-9">
  </a>
</body>
</html>
