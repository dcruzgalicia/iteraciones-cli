$if(collection)$
    <!-- #2483: en una collection no hay tarjeta de contenido. Sus datos los
         imprime la banda de metadatos (#2487) y su body propio se sube ahí con
         el post-proceso; aquí solo quedan las tarjetas de cada file, que salen
         del body al nivel del masonry, junto a las demás tarjetas. -->
    $body$
$else$
    <div class="break-inside-avoid pb-6">
      <!-- Tarjeta documento -->
      <!-- #2487: los metadatos viven en la banda de arriba, así que aquí solo
           queda el cuerpo del documento. -->

        class="relative prose prose-xl prose-accent dark:prose-invert max-w-none rounded-tr-2xl rounded-bl-2xl border border-accent-500/30 bg-stone-50/75 dark:bg-stone-900/65 p-6 shadow-sm ring-1 ring-inset ring-stone-950/5 dark:ring-white/5 transition-colors duration-200 hover:border-accent-500/40 [overflow-wrap:anywhere] [&::before]:pointer-events-none [&::before]:absolute [&::before]:left-2 [&::before]:top-2 [&::before]:h-3 [&::before]:w-3 [&::before]:border-l [&::before]:border-t [&::before]:border-accent-500/40 [&::before]:content-[''] [&::after]:pointer-events-none [&::after]:absolute [&::after]:bottom-2 [&::after]:right-2 [&::after]:h-3 [&::after]:w-3 [&::after]:border-b [&::after]:border-r [&::after]:border-accent-500/40 [&::after]:content-['']
        [&_blockquote]:border-accent-500/40
