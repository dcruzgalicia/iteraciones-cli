$if(formats)$
<div class="break-inside-avoid pb-6">
      <section class="relative rounded-tr-xl rounded-bl-xl tarjeta p-6 ring-1 ring-inset ring-stone-950/5 dark:ring-white/5">
        <h2 class="inline-block align-top rounded-full border border-accent-500/30 bg-accent-500/12 px-3 py-1 font-normal uppercase tracking-wide text-xs leading-none mt-0 mb-12 text-accent-800 dark:text-accent-300">Descarga</h2>
        <ul class="m-0 list-disc space-y-3 ps-6">
$if(fmt-pdf)$
        <li>
          <a download href="$fmt-pdf$" class="underline underline-offset-4 decoration-current/40 transition-colors duration-200 hover:decoration-current">PDF</a>
        </li>
$endif$
$if(fmt-epub)$
        <li>
          <a download href="$fmt-epub$" class="underline underline-offset-4 decoration-current/40 transition-colors duration-200 hover:decoration-current">EPUB</a>
        </li>
$endif$
$if(fmt-latex)$
        <li>
          <a download href="$fmt-latex$" class="underline underline-offset-4 decoration-current/40 transition-colors duration-200 hover:decoration-current">LaTeX</a>
        </li>
$endif$
$if(fmt-markdown)$
        <li>
          <a download href="$fmt-markdown$" class="underline underline-offset-4 decoration-current/40 transition-colors duration-200 hover:decoration-current">Markdown</a>
        </li>
$endif$
        </ul>
      </section>
    </div>
$endif$
