    <div id="card-identity" class="sitio-marca">
      <div class="sitio-marca__fila">
        $if(home-href)$
        <a href="$home-href$" class="sitio-marca__logo" aria-label="$site-title$">$logo-block$</a>
        $else$
        $logo-block$
        $endif$
        <div class="sitio-marca__texto">
          $if(home-href)$
          <a href="$home-href$" class="sitio-titulo">$site-title$</a>
          $else$
          <span class="sitio-titulo">$site-title$</span>
          $endif$
          $if(tagline)$<span class="sitio-lema">$tagline$</span>$endif$
        </div>
      </div>
    </div>
