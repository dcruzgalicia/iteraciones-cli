    <div id="card-identity" class="min-w-0">

      <div class="flex items-center gap-3">
        $if(home-href)$
        <a href="$home-href$" class="no-underline shrink-0" aria-label="$site-title$">$logo-block$</a>
        $else$
        $logo-block$
        $endif$
        <div class="flex min-w-0 flex-col items-start">
          $if(home-href)$
          <a href="$home-href$" class="font-semibold text-2xl leading-none text-accent-800 dark:text-accent-300 no-underline hover:underline">$site-title$</a>
          $else$
          <span class="font-semibold text-2xl leading-none text-accent-800 dark:text-accent-300">$site-title$</span>
          $endif$
          $if(tagline)$<span class="mt-1 text-base italic leading-none text-stone-600 dark:text-stone-400">$tagline$</span>$endif$
        </div>
      </div>
    </div>
