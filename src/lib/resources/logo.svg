<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 100 100">
  <title>Iteraciones</title>

  <defs>
    <circle id="n-in" cx="22" cy="0" r="4" fill="none" stroke="currentColor" stroke-width="2.4"/>
    <circle id="n-in-sm" cx="22" cy="0" r="2" fill="none" stroke="currentColor" stroke-width="1.4"/>
    <circle id="n-out" cx="36" cy="0" r="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
    <circle id="n-out-sm" cx="36" cy="0" r="1.25" fill="none" stroke="currentColor" stroke-width="1.1"/>
    <circle id="n-dot" cx="42" cy="0" r="1.4" fill="currentColor"/>
  </defs>

  <circle cx="50" cy="50" r="44" fill="none" stroke="currentColor" stroke-width="3.6"/>
  <circle cx="50" cy="50" r="36" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <circle cx="50" cy="50" r="22" fill="none" stroke="currentColor" stroke-width="1.2"/>

  <g transform="translate(50,50)">
    <use href="#n-in"/>
    <use href="#n-in-sm" transform="rotate(45)"/>
    <use href="#n-in" transform="rotate(90)"/>
    <use href="#n-in-sm" transform="rotate(135)"/>
    <use href="#n-in" transform="rotate(180)"/>
    <use href="#n-in-sm" transform="rotate(225)"/>
    <use href="#n-in" transform="rotate(270)"/>
    <use href="#n-in-sm" transform="rotate(315)"/>
  </g>

  <g transform="translate(50,50) rotate(45)">
    <use href="#n-out"/>
    <use href="#n-out-sm" transform="rotate(45)"/>
    <use href="#n-out" transform="rotate(90)"/>
    <use href="#n-out-sm" transform="rotate(135)"/>
    <use href="#n-out" transform="rotate(180)"/>
    <use href="#n-out-sm" transform="rotate(225)"/>
    <use href="#n-out" transform="rotate(270)"/>
    <use href="#n-out-sm" transform="rotate(315)"/>
  </g>

  <g transform="translate(50,50)">
    <use href="#n-dot"/>
    <use href="#n-dot" transform="rotate(45)"/>
    <use href="#n-dot" transform="rotate(90)"/>
    <use href="#n-dot" transform="rotate(135)"/>
    <use href="#n-dot" transform="rotate(180)"/>
    <use href="#n-dot" transform="rotate(225)"/>
    <use href="#n-dot" transform="rotate(270)"/>
    <use href="#n-dot" transform="rotate(315)"/>
  </g>

  <circle cx="50" cy="50" r="5.5" fill="none" stroke="currentColor" stroke-width="3"/>
  <circle cx="50" cy="50" r="3.2" fill="currentColor"/>
</svg>
